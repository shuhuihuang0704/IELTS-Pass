name: Deploy free backup site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build backup site
        run: npm run build:backup
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload backup site
        uses: actions/upload-pages-artifact@v4
        with:
          path: backup-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish backup site
        id: deployment
        uses: actions/deploy-pages@v4
